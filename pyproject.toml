[project]
name = "job-search-crew"
version = "0.1.0"
description = "CrewAI-powered automated job search with a FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "crewai[litellm]>=1.15.5",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
